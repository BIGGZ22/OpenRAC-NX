[package]
name = "openrac-launcher"
description = "OpenRAC Launcher: set up, build and play the Ratchet & Clank decompilations"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "openrac_launcher_lib"
# cdylib for Android (the APK loads the launcher as a library), rlib for the desktop program
# (main.rs). No staticlib: that is iOS's, and a desktop build linked one too.
crate-type = ["cdylib", "rlib"]

[build-dependencies]
serde_json.workspace = true
tauri-build = { version = "2", features = [] }

[dependencies]
openrac-launcher-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# Android installs the launcher from the APK, and updates it with its own updater (src/android.rs).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.14"
# One launcher at a time: a second start shows the first one's window (src/lib.rs, run).
tauri-plugin-single-instance = "2"
