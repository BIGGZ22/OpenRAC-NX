# The launcher's Rust side: `core` holds everything that does not need a window
# (the game catalogue, actions, settings, detection, the job runner) and builds
# and tests on any machine; `src-tauri` is the desktop app, a thin layer of
# Tauri commands over `core`. See docs/ARCHITECTURE.md.
[workspace]
resolver = "2"
members = ["core", "src-tauri"]

[workspace.package]
version = "0.4.3"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
