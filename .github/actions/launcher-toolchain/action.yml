# What the launcher builds with: Node with Yarn (the version launcher/package.json names, through
# Corepack), Rust, and Cargo's downloads and target/ kept between runs under `cache-key`.
name: The launcher's toolchain
description: Node, Yarn, Rust and a Cargo cache for launcher/
inputs:
  cache-key:
    description: what the Cargo cache is kept under (one for each job and system)
    required: true
  targets:
    description: Rust targets beside the host's, comma separated
    default: ""
  components:
    description: Rust components, comma separated
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "22"
        package-manager-cache: false
    - shell: bash
      run: corepack enable
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: stable
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}
    # Incremental builds only grow the cached target/: a cache's build is never resumed in place.
    - shell: bash
      run: echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          launcher/target
        key: ${{ inputs.cache-key }}-${{ hashFiles('launcher/Cargo.lock') }}
        restore-keys: ${{ inputs.cache-key }}-
