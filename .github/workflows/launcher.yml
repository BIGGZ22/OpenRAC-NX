# The launcher's installers, built for Windows, Linux, macOS and Android and kept as
# the run's artifacts (Actions, the run, "Artifacts"). A tag `launcher-v*`
# also puts them on a draft release of that name, to be looked over and
# published by hand.
#
# They are not signed: Windows SmartScreen and macOS Gatekeeper warn about
# them until the project has certificates.
#
# An installer carries what a player needs beside their disc image: the game
# built for the system, the set-up and level tools and a Python to run them
# (the `game` job, tools/bundle_standalone.py). The launcher uses that copy
# when it finds no OpenRAC checkout (launcher/core/src/detect.rs).
#
# Android is one more row of both matrices: its `game` builds the port with the
# runner's NDK (tools/build_android.py --no-apk), its `build` makes the APK
# (docs/port/ANDROID.md). Compiles are cached (ccache, Cargo, Gradle), so a run
# that changes only the launcher rebuilds little of the game.
name: launcher

on:
  push:
    branches: [master]
    tags: ["launcher-v*"]
    paths:
      - "launcher/**"
      - "port/**"
      - "editor/**"
      - "games/rac1/**"
      - "tools/bundle_standalone.py"
      - "tools/build_android.py"
      - "tools/build_port.py"
      - "tools/extractor.py"
      - ".github/workflows/launcher.yml"
  pull_request:
    paths:
      - "launcher/**"
      - "port/**"
      - "editor/**"
      - "games/rac1/**"
      - "tools/bundle_standalone.py"
      - "tools/build_android.py"
      - "tools/build_port.py"
      - "tools/extractor.py"
      - ".github/workflows/launcher.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What an installer carries: the game built with SDL3 in it (the port's `standalone` preset), the
  # tools and a Python, as one archive for each system (a tar: artifacts drop the files' modes). On
  # Android the archive is what tools/build_android.py puts in the launcher's Android project.
  game:
    name: game (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # python-build-standalone, a fixed release, each archive checked against its SHA-256.
      PYTHON_RELEASE: "20261009"
      PYTHON_VERSION: "3.12.15"
      LLVM_VERSION: "21.1.4"
      LLVM_SHA256: 8e39f8051cd10a163c1fab304f16d8e16a9c0f5e94b59d08853bbab630bd65dd
      # Every compile through ccache (CMake reads these on its first configure).
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            python: x86_64-pc-windows-msvc
            python_sha256: 11ed9f8a6ac64fb1b5a55e40e305a6744a3f77a70863c8f8197a6e4349abc64a
          # Ubuntu 22.04, with LLVM's compiler and its C++ library built into the game: the game
          # then needs only the system's C library, glibc 2.35 or later (Ubuntu 22.04, Debian 12,
          # Linux Mint 21, Fedora 36, SteamOS). Ubuntu 22.04's own C++ library is too old for the
          # port (<format>), and one built on 24.04 asked for glibc 2.38.
          - name: linux
            os: ubuntu-22.04
            python: x86_64-unknown-linux-gnu
            python_sha256: ffa8f85f1b56e88b687f08d743d817015524b86a9365fd921243132b80f1a36d
          # Linux ARM64 (aarch64), built on Ubuntu 24.04 ARM runner.
          - name: linux-arm64
            os: ubuntu-24.04-arm
            python: aarch64-unknown-linux-gnu
            python_sha256: 2e1ba0e7f22e01c534caebf7f09e7820322bc0d055271d3434af671e8400f96f
          # Apple silicon: the runner's own. An Intel Mac's launcher finds no game it can run in
          # its copy and works on a checkout, as before.
          - name: macos
            os: macos-latest
            python: aarch64-apple-darwin
            python_sha256: 233f8e15255b3e1d1fd47ea5dd5230dfed803f371138e896e54d98c60ae19f6f
          # arm64-v8a, API 29 and later, with the runner's NDK; its Python is Chaquopy's.
          - name: android
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: game-${{ matrix.name }}
          max-size: 1G

      - name: Compilers and what SDL3 is built against (Linux)
        if: matrix.name == 'linux' || matrix.name == 'linux-arm64'
        run: |
          sudo apt-get update
          # LLVM 19 from apt.llvm.org: Clang, and libc++ to build into the game.
          wget -qO "$RUNNER_TEMP/llvm.sh" https://apt.llvm.org/llvm.sh
          sudo bash "$RUNNER_TEMP/llvm.sh" 19
          sudo apt-get install -y libc++-19-dev libc++abi-19-dev
          sudo ln -sf /usr/bin/clang-19 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-19 /usr/local/bin/clang++
          # CMake reads these when it first configures: libc++ and the compiler's runtime in the game.
          echo "CXXFLAGS=-stdlib=libc++" >> "$GITHUB_ENV"
          echo "LDFLAGS=-stdlib=libc++ -static-libstdc++ -static-libgcc -l:libc++abi.a" >> "$GITHUB_ENV"
          sudo apt-get install -y ninja-build pkg-config \
            libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxfixes-dev libwayland-dev wayland-protocols libxkbcommon-dev libdecor-0-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev libdrm-dev libgbm-dev

      - name: Ninja (macOS)
        if: matrix.name == 'macos'
        run: brew install ninja

      # As the port's own Windows job does (checks.yml): LLVM at a fixed version, checked, unpacked.
      - name: Clang (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $ProgressPreference = "SilentlyContinue"
          $installer = Join-Path $env:RUNNER_TEMP "llvm.exe"
          $release = "https://github.com/llvm/llvm-project/releases/download"
          Invoke-WebRequest "$release/llvmorg-${env:LLVM_VERSION}/LLVM-${env:LLVM_VERSION}-win64.exe" -OutFile $installer
          $sha256 = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          if ($sha256 -ne $env:LLVM_SHA256) { throw "LLVM ${env:LLVM_VERSION}: its SHA-256 is $sha256" }
          $llvm = Join-Path $env:RUNNER_TEMP "llvm"
          7z x $installer "-o$llvm" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z could not unpack LLVM's installer" }
          "OPENRAC_CLANG=$llvm\bin\clang.exe" >> $env:GITHUB_ENV
          "$llvm\bin" >> $env:GITHUB_PATH

      # The runner's SDK carries a recent NDK; its Clang is on the image for hostgen.
      - name: The NDK and Ninja (Android)
        if: matrix.name == 'android'
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          grep Revision "$ANDROID_NDK_LATEST_HOME/source.properties"
          clang --version
          pip install ninja

      - name: Build the game
        if: matrix.name != 'android'
        run: python tools/build_port.py rac1-pal rac1-ntsc --preset standalone

      # The libraries, SDL's Java and the carried copy, in the launcher's Android project.
      - name: Build the game, the libraries and the copy (Android)
        if: matrix.name == 'android'
        run: |
          python tools/build_android.py --no-apk
          main=launcher/src-tauri/gen/android/app/src/main
          llvm=$(ls -d "$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/*/bin | head -1)
          for lib in libopenrac-rac1-pal.so libopenrac-rac1-pal-cli.so libopenrac-python.so; do
            echo "$lib:"; "$llvm/llvm-readelf" -d "$main/jniLibs/arm64-v8a/$lib" | grep NEEDED
          done
          tar -czf openrac-standalone.tar.gz -C "$main" jniLibs sdl-java assets

      - name: A Python for the tools
        if: matrix.name != 'android'
        shell: bash
        run: |
          file="cpython-${PYTHON_VERSION}+${PYTHON_RELEASE}-${{ matrix.python }}-install_only_stripped.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/python.tar.gz" \
            "https://github.com/astral-sh/python-build-standalone/releases/download/${PYTHON_RELEASE}/${file}"
          python - "$RUNNER_TEMP/python.tar.gz" "${{ matrix.python_sha256 }}" <<'PY'
          import hashlib, sys
          got = hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest()
          sys.exit(0 if got == sys.argv[2] else f"the Python archive's SHA-256 is {got}")
          PY
          # From inside the folder: on Windows tar reads "D:\..." as a host named D.
          cd "$RUNNER_TEMP" && mkdir -p python && tar -xzf python.tar.gz -C python

      - name: Put the copy together and try it
        if: matrix.name != 'android'
        shell: bash
        run: |
          python tools/bundle_standalone.py build/standalone --game-build port/build/standalone \
            --python "$RUNNER_TEMP/python/python"
          # Its own Python runs its own tools, and the game starts far enough to say what it is.
          py=build/standalone/python/bin/python3; [ -x "$py" ] || py=build/standalone/python/python.exe
          "$py" build/standalone/tools/extractor.py --help > /dev/null
          "$py" build/standalone/editor/extract.py --help > /dev/null
          # The program as the launcher finds it: openrac-<id>, openrac-<id>.exe, or on macOS the
          # program in its application bundle, apps/openrac-<id>/<title>.app (port/cmake/MacApp.cmake).
          program() {
            local app; app=$(ls -d "$(dirname "$1")/apps/$(basename "$1")"/*.app/Contents/MacOS/* 2>/dev/null | head -1)
            if [ -n "$app" ]; then echo "$app"; elif [ -f "$1" ]; then echo "$1"; else echo "$1.exe"; fi
          }
          game=$(program build/standalone/port/build/release/openrac-rac1-pal)
          "$game" --help || true
          # Every disc's program is carried: the launcher plays the one the player's disc is.
          us=$(program build/standalone/port/build/release/openrac-rac1-ntsc)
          [ -f "$us" ] || { echo "the copy carries no openrac-rac1-ntsc"; exit 1; }
          "$us" --help || true
          # On Linux: what the game asks of the system (only libc and libm, glibc 2.35 at most on x86_64 Ubuntu 22.04).
          if [ "${{ matrix.name }}" = linux ]; then
            readelf -d "$game" | grep NEEDED
            need=$(objdump -T "$game" | grep -oE 'GLIBC_2\.[0-9]+' | sort -t. -k2 -n | tail -1)
            echo "needs $need"
            case "$need" in GLIBC_2.3[6-9]|GLIBC_2.[4-9]*) echo "the game needs a newer glibc than 2.35"; exit 1;; esac
            if readelf -d "$game" | grep -q 'libstdc++'; then echo "the game needs the system's libstdc++"; exit 1; fi
          fi
          if [ "${{ matrix.name }}" = linux-arm64 ]; then
            readelf -d "$game" | grep NEEDED
            need=$(objdump -T "$game" | grep -oE 'GLIBC_2\.[0-9]+' | sort -t. -k2 -n | tail -1)
            echo "needs $need"
            if readelf -d "$game" | grep -q 'libstdc++'; then echo "the game needs the system's libstdc++"; exit 1; fi
          fi
          tar -czf openrac-standalone.tar.gz -C build/standalone .

      - uses: actions/upload-artifact@v4
        with:
          name: openrac-standalone-${{ matrix.name }}
          path: openrac-standalone.tar.gz
          if-no-files-found: error
          retention-days: 7

  build:
    name: ${{ matrix.name }}
    needs: game
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            tauri: build
            files: |
              launcher/target/release/bundle/nsis/*.exe
              launcher/target/release/bundle/msi/*.msi
              launcher/target/release/bundle/nsis/*.zip
              launcher/target/release/bundle/nsis/*.sig
          # The oldest Ubuntu the runners offer: what is built there starts
          # on newer systems too, not the other way round.
          - name: linux
            os: ubuntu-22.04
            tauri: build --bundles deb,rpm,appimage
            files: |
              launcher/target/release/bundle/deb/*.deb
              launcher/target/release/bundle/rpm/*.rpm
              launcher/target/release/bundle/appimage/*.AppImage
              launcher/target/release/bundle/appimage/*.tar.gz
              launcher/target/release/bundle/appimage/*.sig
          - name: linux-arm64
            os: ubuntu-24.04-arm
            tauri: build --bundles deb,rpm,appimage
            files: |
              launcher/target/release/bundle/deb/*.deb
              launcher/target/release/bundle/rpm/*.rpm
              launcher/target/release/bundle/appimage/*.AppImage
              launcher/target/release/bundle/appimage/*.tar.gz
              launcher/target/release/bundle/appimage/*.sig
          # One program for Apple silicon and Intel.
          - name: macos
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri: build --target universal-apple-darwin --bundles app,dmg
            files: |
              launcher/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              launcher/target/universal-apple-darwin/release/bundle/macos/*.tar.gz
              launcher/target/universal-apple-darwin/release/bundle/macos/*.sig
          # A debug APK signed with the runner's debug key, so that it installs as it is; the
          # device tests are in port/android/README.md.
          - name: android
            os: ubuntu-latest
            targets: aarch64-linux-android
            tauri: android build --apk --target aarch64 --debug
            files: launcher/src-tauri/gen/android/app/build/outputs/apk/*/debug/OpenRAC*.apk
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Yarn (the version package.json names, through Corepack)
        run: corepack enable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            launcher/target
          key: launcher-${{ matrix.name }}-${{ hashFiles('launcher/Cargo.lock') }}
          restore-keys: launcher-${{ matrix.name }}-

      - uses: actions/setup-java@v4
        if: matrix.name == 'android'
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: The NDK (Android)
        if: matrix.name == 'android'
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Tauri's system libraries
        if: matrix.name == 'linux' || matrix.name == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev patchelf rpm file
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true

      - uses: actions/download-artifact@v4
        with:
          name: openrac-standalone-${{ matrix.name }}
          path: ${{ runner.temp }}/standalone
      - name: The copy of OpenRAC the installer carries
        shell: bash
        run: |
          # The archive by a relative name: on Windows tar reads "D:\..." as a host named D.
          cp "$RUNNER_TEMP/standalone/openrac-standalone.tar.gz" openrac-standalone.tar.gz
          tar -xzf openrac-standalone.tar.gz -C ${{ matrix.name == 'android' && 'src-tauri/gen/android/app/src/main' || 'src-tauri/resources/openrac' }}
          rm openrac-standalone.tar.gz

      # The cache above keeps target/, and with it the installers of the last version: without
      # this a release carried 0.2.0's files beside 0.3.0's.
      - name: No installers from an earlier build
        shell: bash
        run: rm -rf target/release/bundle target/universal-apple-darwin/release/bundle

      - name: Prepare signing key
        if: env.RAW_KEY != '' && matrix.name != 'android'
        shell: bash
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const tempDir = process.env.RUNNER_TEMP || "/tmp";
            const keyPath = path.resolve(tempDir, "updater.key");
            fs.writeFileSync(keyPath, process.env.RAW_KEY.trim());
            fs.appendFileSync(process.env.GITHUB_ENV, `TAURI_SIGNING_PRIVATE_KEY=${keyPath}\n`);
          '

      # Without the signing key (a fork's run) the installers are built without the updater's
      # signed archives, which Tauri refuses to make unsigned.
      - name: Build the installers
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          yarn install --immutable
          unsigned=()
          [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ] || unsigned=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          yarn tauri ${{ matrix.tauri }} "${unsigned[@]}"

      # Named as the desktop installers are, and checked: the game's activity, SDL's and the
      # libraries the programs need are in it.
      - name: What the APK carries (Android)
        if: matrix.name == 'android'
        run: |
          built=$(ls src-tauri/gen/android/app/build/outputs/apk/*/debug/*.apk | head -1)
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          apk="$(dirname "$built")/OpenRAC.Launcher_${version}_android-arm64-debug.apk"
          mv "$built" "$apk"
          unzip -l "$apk" | grep -E "lib/arm64-v8a/|assets/openrac.zip|classes" | sort -k4
          unzip -p "$apk" 'classes*.dex' | grep -ac "dev/openrac/game/GameActivity"
          unzip -p "$apk" 'classes*.dex' | grep -ac "org/libsdl/app/SDLActivity"
          for lib in libopenrac-rac1-pal.so libopenrac-rac1-pal-cli.so libSDL3.so libc++_shared.so \
                     libopenrac-python.so libpython3.13.so libmain_hook.so libopenrac_launcher_lib.so; do
            unzip -l "$apk" "lib/arm64-v8a/$lib" > /dev/null || { echo "the APK has no $lib"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: openrac-launcher-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: warn

  # The launcher built on Fedora itself (the release players run), as an .rpm made against
  # Fedora's own WebKitGTK and GTK.
  fedora:
    name: fedora
    needs: game
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    timeout-minutes: 60
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    defaults:
      run:
        working-directory: launcher
    steps:
      - name: Tools and Tauri's system libraries
        working-directory: /
        run: |
          dnf install -y --setopt=install_weak_deps=False git gcc gcc-c++ make curl file rpm-build \
            nodejs npm webkit2gtk4.1-devel gtk3-devel librsvg2-devel libsoup3-devel openssl-devel
          npm install -g corepack
      - uses: actions/checkout@v4
      - name: Yarn (the version package.json names, through Corepack)
        run: corepack enable
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            launcher/target
          key: launcher-fedora-${{ hashFiles('launcher/Cargo.lock') }}
          restore-keys: launcher-fedora-

      - uses: actions/download-artifact@v4
        with:
          name: openrac-standalone-linux
          path: ${{ runner.temp }}/standalone
      - name: The copy of OpenRAC the installer carries
        shell: bash
        run: |
          # The archive by a relative name: on Windows tar reads "D:\..." as a host named D.
          cp "$RUNNER_TEMP/standalone/openrac-standalone.tar.gz" openrac-standalone.tar.gz
          tar -xzf openrac-standalone.tar.gz -C src-tauri/resources/openrac
          rm openrac-standalone.tar.gz

      - name: No installers from an earlier build
        run: rm -rf target/release/bundle

      - name: Prepare signing key
        if: env.RAW_KEY != ''
        shell: bash
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const tempDir = process.env.RUNNER_TEMP || "/tmp";
            const keyPath = path.resolve(tempDir, "updater.key");
            fs.writeFileSync(keyPath, process.env.RAW_KEY.trim());
            fs.appendFileSync(process.env.GITHUB_ENV, `TAURI_SIGNING_PRIVATE_KEY=${keyPath}\n`);
          '

      # Its file is named as the one built on Ubuntu is: "fc44" tells them apart on a release,
      # which takes one file of a name.
      - name: Build the installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          yarn install --immutable
          unsigned=()
          [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ] || unsigned=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          yarn tauri build --bundles rpm "${unsigned[@]}"
          for f in target/release/bundle/rpm/*.x86_64.rpm; do mv "$f" "${f%.x86_64.rpm}.fc44.x86_64.rpm"; done

      - uses: actions/upload-artifact@v4
        with:
          name: openrac-launcher-fedora
          path: launcher/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  # A tag `launcher-v*`: the installers of all the builds on a draft
  # release. Nothing is published until someone publishes the draft.
  release:
    if: startsWith(github.ref, 'refs/tags/launcher-v')
    needs: [build, fedora]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: openrac-launcher-*
          path: installers
          merge-multiple: true
      - name: Generate updater manifest
        env:
          TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 tools/updater_manifest.py installers --tag "$TAG" --repo "$GH_REPO" --output installers/latest.json
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # The installers' names have spaces in them: an array, not a word list.
          mapfile -d '' files < <(find installers -type f -print0 | sort -z)
          printf '%s\n' "${files[@]}"
          gh release create "$TAG" --draft --title "OpenRAC Launcher ${TAG#launcher-v}" \
            --notes "Installers built by the launcher workflow from $GITHUB_SHA." \
            "${files[@]}"
