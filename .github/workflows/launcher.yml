# The launcher's installers, built for Windows, Linux, macOS and Android and kept as
# the run's artifacts (Actions, the run, "Artifacts"). A tag `launcher-v*`
# also puts them on a draft release of that name, to be looked over and
# published by hand. Each build's updater reads the repository that built it:
# a tag's, that repository's latest release; a build of a branch, the
# pre-release launcher-dev-<branch> that the dev-release job keeps current
# (launcher/docs/RELEASING.md).
#
# They are not signed: Windows SmartScreen and macOS Gatekeeper warn about
# them until the project has certificates.
#
# An installer carries what a player needs beside their disc image: the game
# built for the system, the set-up and level tools and a Python to run them
# (tools/bundle_standalone.py). The launcher uses that copy when it finds no
# OpenRAC checkout (launcher/core/src/detect.rs).
#
# One job per system, a row of the `build` matrix: it builds the game and its
# copy straight into the launcher's resources (on Android, its Android
# project: tools/build_android.py --no-apk), then the installer around them.
# A new system is a row, with `if: matrix.name == ...` only on the steps that
# are its own. What a run would redo is kept between runs: the game's C as
# hostgen writes it (skipped when its inputs are the same), CMake's
# configuration, every compile (ccache), the Rust dependencies (rust-cache)
# and Gradle's. The Linux games are carried without their debug info.
#
# Every action is pinned to a commit (Dependabot, .github/dependabot.yml,
# moves the pins), and every download is checked against its SHA-256.
name: launcher

on:
  push:
    branches: [master]
    tags: ["launcher-v*"]
    paths: &paths
      - "launcher/**"
      - "port/**"
      - "editor/**"
      - "games/rac1/**"
      - "tools/bundle_standalone.py"
      - "tools/build_android.py"
      - "tools/build_port.py"
      - "tools/extractor.py"
      - ".github/workflows/launcher.yml"
      - ".github/actions/**"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Fedora's row runs in Fedora itself; the others on the runner.
    container: ${{ matrix.container }}
    timeout-minutes: 60
    env:
      NAME: ${{ matrix.name }}
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      # python-build-standalone, a fixed release, each archive checked against its SHA-256.
      PYTHON_RELEASE: "20261009"
      PYTHON_VERSION: "3.12.15"
      PYTHON: ${{ matrix.python }}
      PYTHON_SHA256: ${{ matrix.python_sha256 }}
      # Every compile through ccache (CMake reads these on its first configure).
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      # Where the copy goes: the installer's resources, or on Android its project.
      COPY: launcher/src-tauri/resources/openrac
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            python: x86_64-pc-windows-msvc
            python_sha256: 11ed9f8a6ac64fb1b5a55e40e305a6744a3f77a70863c8f8197a6e4349abc64a
            tauri: build
            files: |
              launcher/target/release/bundle/nsis/*.exe
              launcher/target/release/bundle/msi/*.msi
              launcher/target/release/bundle/nsis/*.zip
              launcher/target/release/bundle/nsis/*.sig
          # Ubuntu 22.04, the oldest the runners offer, with LLVM's compiler and its C++ library
          # built into the game: the game then needs only the system's C library, glibc 2.35 or
          # later (Ubuntu 22.04, Debian 12, Linux Mint 21, Fedora 36, SteamOS), and the launcher
          # built here starts on newer systems too. Ubuntu 22.04's own C++ library is too old for
          # the port (<format>), and one built on 24.04 asked for glibc 2.38.
          - name: linux
            os: ubuntu-22.04
            python: x86_64-unknown-linux-gnu
            python_sha256: ffa8f85f1b56e88b687f08d743d817015524b86a9365fd921243132b80f1a36d
            tauri: build --bundles deb,rpm,appimage
            files: &linux-files |
              launcher/target/release/bundle/deb/*.deb
              launcher/target/release/bundle/rpm/*.rpm
              launcher/target/release/bundle/appimage/*.AppImage
              launcher/target/release/bundle/appimage/*.tar.gz
              launcher/target/release/bundle/appimage/*.sig
          - name: linux-arm64
            os: ubuntu-24.04-arm
            python: aarch64-unknown-linux-gnu
            python_sha256: 2e1ba0e7f22e01c534caebf7f09e7820322bc0d055271d3434af671e8400f96f
            tauri: build --bundles deb,rpm,appimage
            files: *linux-files
          # Fedora itself (the release players run): an .rpm made against Fedora's own WebKitGTK
          # and GTK, carrying a game built with Fedora's compiler.
          - name: fedora
            os: ubuntu-latest
            container: registry.fedoraproject.org/fedora:44
            python: x86_64-unknown-linux-gnu
            python_sha256: ffa8f85f1b56e88b687f08d743d817015524b86a9365fd921243132b80f1a36d
            tauri: build --bundles rpm
            files: launcher/target/release/bundle/rpm/*.rpm
          # One launcher for Apple silicon and Intel; the game is Apple silicon's (an Intel Mac's
          # launcher finds no game it can run in its copy and works on a checkout).
          - name: macos
            os: macos-latest
            python: aarch64-apple-darwin
            python_sha256: 233f8e15255b3e1d1fd47ea5dd5230dfed803f371138e896e54d98c60ae19f6f
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri: build --target universal-apple-darwin --bundles app,dmg
            files: |
              launcher/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              launcher/target/universal-apple-darwin/release/bundle/macos/*.tar.gz
              launcher/target/universal-apple-darwin/release/bundle/macos/*.sig
          # arm64-v8a, API 29 and later, with the runner's NDK; its Python is Chaquopy's. A debug
          # APK, signed with the launcher's own key when the repository has it (the
          # ANDROID_KEYSTORE secrets: updates install only over an APK of the same key), else
          # with the runner's debug key; the device tests are in port/android/README.md.
          - name: android
            os: ubuntu-latest
            targets: aarch64-linux-android
            tauri: android build --apk --target aarch64 --debug
            files: launcher/src-tauri/gen/android/app/build/outputs/apk/*/debug/OpenRAC*.apk*
    defaults:
      run:
        shell: bash
    steps:
      - name: Compilers, tools and Tauri's system libraries (Fedora)
        if: matrix.name == 'fedora'
        run: |
          dnf install -y --setopt=install_weak_deps=False git curl tar xz gcc gcc-c++ make file rpm-build \
            clang cmake ninja-build ccache python3 python-unversioned-command binutils \
            webkit2gtk4.1-devel gtk3-devel librsvg2-devel libsoup3-devel openssl-devel \
            mesa-libGL-devel mesa-libEGL-devel libX11-devel libXext-devel libXrandr-devel libXcursor-devel \
            libXi-devel libXScrnSaver-devel libXfixes-devel wayland-devel wayland-protocols-devel \
            libxkbcommon-devel libdecor-devel alsa-lib-devel pulseaudio-libs-devel pipewire-devel \
            dbus-devel systemd-devel libdrm-devel mesa-libgbm-devel
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.name != 'fedora'
        with:
          python-version: "3.12"
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: game-${{ matrix.name }}
          max-size: 1G
      # The game's C as hostgen wrote it last (port/tools/hostgen): hostgen checks its inputs'
      # fingerprint and skips the translation, the longest step of a game's build, when they
      # are the same. And CMake's configuration without the objects (its cache, which holds the
      # answers of SDL's hundreds of checks, and the dependencies' sources): the configure step
      # was a minute on Linux and two on Windows. Any version of either is a good start: a stale
      # translation is made again, a changed CMakeLists.txt configured again.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            port/build/*/games/*/gen
            !port/build/*/games/*/gen/prep
            port/build/*/CMakeCache.txt
            port/build/*/CMakeFiles
            port/build/*/_deps/*-src
            port/build/*/_deps/*-subbuild
            !port/build/**/*.o
            !port/build/**/*.obj
            !port/build/**/*.pdb
          key: port-${{ matrix.name }}-${{ hashFiles('games/rac1/src/**', 'games/rac1/include/**', 'games/rac1/config/**', 'games/rac1/ntsc/src/**', 'games/rac1/ntsc/include/**', 'games/rac1/ntsc/config/**', 'port/game/**', 'port/tools/hostgen/*.py', 'port/tools/hostgen/include/**', 'port/**/CMakeLists.txt', 'port/cmake/**', 'port/CMakePresets.json') }}
          restore-keys: |
            port-${{ matrix.name }}-
            hostgen-${{ matrix.name }}-

      # LLVM 19 from apt.llvm.org (its key checked by fingerprint): Clang, and libc++ to build
      # into the game.
      - name: Compilers and what SDL3 is built against (Linux)
        if: matrix.name == 'linux' || matrix.name == 'linux-arm64'
        run: |
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          curl -sSfL https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor > "$RUNNER_TEMP/llvm.gpg"
          gpg --show-keys --with-colons "$RUNNER_TEMP/llvm.gpg" | grep -q '^fpr:*6084F3CF814B57C1CF12EFD515CF4D18AF4F7421:' \
            || { echo "apt.llvm.org's key is not the one expected"; exit 1; }
          sudo install -m 644 "$RUNNER_TEMP/llvm.gpg" /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/$codename/ llvm-toolchain-$codename-19 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-19 lld-19 libc++-19-dev libc++abi-19-dev \
            ninja-build pkg-config \
            libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxfixes-dev libwayland-dev wayland-protocols libxkbcommon-dev libdecor-0-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev libdrm-dev libgbm-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev patchelf rpm file
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true
          sudo ln -sf /usr/bin/clang-19 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-19 /usr/local/bin/clang++
          # CMake reads these when it first configures: libc++ and the compiler's runtime in the game.
          echo "CXXFLAGS=-stdlib=libc++" >> "$GITHUB_ENV"
          echo "LDFLAGS=-stdlib=libc++ -static-libstdc++ -static-libgcc -l:libc++abi.a" >> "$GITHUB_ENV"

      - name: Ninja (macOS)
        if: matrix.name == 'macos'
        run: brew install ninja

      - name: Clang (Windows)
        if: matrix.name == 'windows'
        uses: ./.github/actions/clang-windows

      # The runner's SDK carries a recent NDK; its Clang is on the image for hostgen.
      - name: The NDK and Ninja (Android)
        if: matrix.name == 'android'
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          grep Revision "$ANDROID_NDK_LATEST_HOME/source.properties"
          clang --version
          pip install ninja==1.13.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: matrix.name == 'android'
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: ./.github/actions/launcher-toolchain
        with:
          cache-key: ${{ matrix.name }}
          targets: ${{ matrix.targets }}

      # A configuration the cache brought that CMake cannot use (a compiler the runner's image
      # changed) is made afresh, once.
      - name: Build the game
        if: matrix.name != 'android'
        run: |
          python tools/build_port.py rac1-pal rac1-ntsc --preset standalone || {
            echo "::warning::building again with a fresh configuration"
            rm -rf port/build/standalone/CMakeCache.txt port/build/standalone/CMakeFiles
            python tools/build_port.py rac1-pal rac1-ntsc --preset standalone
          }

      - name: A Python for the tools
        if: matrix.name != 'android'
        run: |
          file="cpython-${PYTHON_VERSION}+${PYTHON_RELEASE}-${PYTHON}-install_only_stripped.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/python.tar.gz" \
            "https://github.com/astral-sh/python-build-standalone/releases/download/${PYTHON_RELEASE}/${file}"
          python - "$RUNNER_TEMP/python.tar.gz" "$PYTHON_SHA256" <<'PY'
          import hashlib, sys
          got = hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest()
          sys.exit(0 if got == sys.argv[2] else f"the Python archive's SHA-256 is {got}")
          PY
          # From inside the folder: on Windows tar reads "D:\..." as a host named D.
          cd "$RUNNER_TEMP" && mkdir -p python && tar -xzf python.tar.gz -C python

      - name: Put the copy together and try it
        if: matrix.name != 'android'
        run: |
          python tools/bundle_standalone.py "$COPY" --game-build port/build/standalone \
            --python "$RUNNER_TEMP/python/python"
          # Its own Python runs its own tools, and the game starts far enough to say what it is.
          py=$COPY/python/bin/python3; [ -x "$py" ] || py=$COPY/python/python.exe
          "$py" "$COPY/tools/extractor.py" --help > /dev/null
          "$py" "$COPY/editor/extract.py" --help > /dev/null
          # The program as the launcher finds it: openrac-<id>, openrac-<id>.exe, or on macOS the
          # program in its application bundle, apps/openrac-<id>/<title>.app (port/cmake/MacApp.cmake).
          program() {
            local app; app=$(ls -d "$(dirname "$1")/apps/$(basename "$1")"/*.app/Contents/MacOS/* 2>/dev/null | head -1)
            if [ -n "$app" ]; then echo "$app"; elif [ -f "$1" ]; then echo "$1"; else echo "$1.exe"; fi
          }
          game=$(program "$COPY/port/build/release/openrac-rac1-pal")
          "$game" --help || true
          # Every disc's program is carried: the launcher plays the one the player's disc is.
          us=$(program "$COPY/port/build/release/openrac-rac1-ntsc")
          [ -f "$us" ] || { echo "the copy carries no openrac-rac1-ntsc"; exit 1; }
          "$us" --help || true
          # On Linux: what the game asks of the system, libc and libm but not libstdc++, and on
          # x86_64 (Ubuntu 22.04) glibc 2.35 at most.
          case "$NAME" in linux*)
            readelf -d "$game" | grep NEEDED
            need=$(objdump -T "$game" | grep -oE 'GLIBC_2\.[0-9]+' | sort -t. -k2 -n | tail -1)
            echo "needs $need"
            if readelf -d "$game" | grep -q 'libstdc++'; then echo "the game needs the system's libstdc++"; exit 1; fi
          esac
          if [ "$NAME" = linux ]; then
            case "$need" in GLIBC_2.3[6-9]|GLIBC_2.[4-9]*) echo "the game needs a newer glibc than 2.35"; exit 1;; esac
          fi

      # The libraries, SDL's Java and the carried copy, in the launcher's Android project.
      - name: Build the game, the libraries and the copy (Android)
        if: matrix.name == 'android'
        run: |
          python tools/build_android.py --no-apk || {
            echo "::warning::building again with a fresh configuration"
            rm -rf port/build/android-arm64/CMakeCache.txt port/build/android-arm64/CMakeFiles
            python tools/build_android.py --no-apk
          }
          llvm=$(ls -d "$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/*/bin | head -1)
          for lib in libopenrac-rac1-pal.so libopenrac-rac1-pal-cli.so libopenrac-python.so; do
            echo "$lib:"; "$llvm/llvm-readelf" -d "launcher/src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a/$lib" | grep NEEDED
          done

      # The cache keeps target/, and with it the installers of the last version: without this a
      # release carried 0.2.0's files beside 0.3.0's.
      - name: No installers from an earlier build
        working-directory: launcher
        run: rm -rf target/release/bundle target/universal-apple-darwin/release/bundle

      # The updater's archives are signed with the project's key. Without it (a fork's run) Tauri
      # refuses to make them, so they are left out. Android's APK is signed with it after the
      # build (below), and with the launcher's own Android key during it.
      - name: Build the installers
        working-directory: launcher
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          OPENRAC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OPENRAC_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OPENRAC_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TAURI: ${{ matrix.tauri }}
          UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          create_updater=false
          if [ -n "$RAW_KEY" ]; then
            printf '%s' "$RAW_KEY" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' > "$RUNNER_TEMP/updater.key"
          fi
          if [ -n "$RAW_KEY" ] && [ "$NAME" != android ]; then
            export TAURI_SIGNING_PRIVATE_KEY="$RUNNER_TEMP/updater.key"
            create_updater=true
          fi
          # The launcher looks for its updates where it was built: this repository's releases, a
          # fork's in a fork. A tag's build (and a pull request's) reads the latest release; a build
          # of a branch is X.Y.Z-dev.<run> and reads that branch's rolling release
          # (launcher-dev-<branch>, the dev-release job), so each build of a branch updates the
          # last. The desktop packages keep X.Y.Z (an MSI takes no "-dev", RPM no "-"): the run
          # goes into the program instead (OPENRAC_LAUNCHER_BUILD), which its updater compares with.
          base=$(node -p "require('./src-tauri/tauri.conf.json').version")
          version=$base
          endpoint="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json"
          if [[ "$GITHUB_REF" != refs/tags/launcher-v* ]] && [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            channel="launcher-dev-$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"
            endpoint="https://github.com/$GITHUB_REPOSITORY/releases/download/$channel/latest.json"
            export OPENRAC_LAUNCHER_BUILD="dev.$GITHUB_RUN_NUMBER"
            if [ "$NAME" = android ]; then
              version="$base-dev.$GITHUB_RUN_NUMBER"
            fi
          fi
          echo "LAUNCHER_VERSION=$version" >> "$GITHUB_ENV"
          config=$(VERSION="$version" ENDPOINT="$endpoint" CREATE="$create_updater" node -e '
            const c = { version: process.env.VERSION,
                        bundle: { createUpdaterArtifacts: process.env.CREATE === "true" },
                        plugins: { updater: { endpoints: [process.env.ENDPOINT] } } };
            // A fork that signs with a key of its own names its public half here (a variable).
            if (process.env.UPDATER_PUBKEY) c.plugins.updater.pubkey = process.env.UPDATER_PUBKEY;
            process.stdout.write(JSON.stringify(c));')
          echo "updates: $version from $endpoint"
          # Every build a version code of its own, above any version's own (Tauri's major*10^6 +
          # minor*10^3 + patch): a home screen takes a new icon only from a new version code.
          export OPENRAC_ANDROID_VERSION_CODE=$((1000000000 + GITHUB_RUN_NUMBER))
          if [ "$NAME" = android ] && [ -n "$ANDROID_KEYSTORE" ]; then
            printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/openrac.jks"
            export OPENRAC_ANDROID_KEYSTORE="$RUNNER_TEMP/openrac.jks"
          fi
          unset RAW_KEY ANDROID_KEYSTORE
          yarn install --immutable
          # $TAURI is the row's own words: split on purpose.
          yarn tauri $TAURI --config "$config"

      # Its file is named as the one built on Ubuntu is: "fc44" tells them apart on a release,
      # which takes one file of a name.
      - name: The installer's name (Fedora)
        if: matrix.name == 'fedora'
        working-directory: launcher
        run: for f in target/release/bundle/rpm/*.x86_64.rpm; do mv "$f" "${f%.x86_64.rpm}.fc44.x86_64.rpm"; done

      # Named as the desktop installers are, and checked: the game's activity, SDL's and the
      # libraries the programs need are in it. Signed for the launcher's updater when the key is
      # there (an .apk.sig beside it, which tools/updater_manifest.py puts in latest.json).
      - name: What the APK carries (Android)
        if: matrix.name == 'android'
        working-directory: launcher
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          built=$(ls src-tauri/gen/android/app/build/outputs/apk/*/debug/*.apk | head -1)
          apk="$(dirname "$built")/OpenRAC.Launcher_${LAUNCHER_VERSION}_android-arm64-debug.apk"
          mv "$built" "$apk"
          unzip -l "$apk" | grep -E "lib/arm64-v8a/|assets/openrac.zip|classes" | sort -k4
          unzip -p "$apk" 'classes*.dex' | grep -ac "dev/openrac/game/GameActivity"
          unzip -p "$apk" 'classes*.dex' | grep -ac "org/libsdl/app/SDLActivity"
          for lib in libopenrac-rac1-pal.so libopenrac-rac1-pal-cli.so libSDL3.so libc++_shared.so \
                     libopenrac-python.so libpython3.13.so libmain_hook.so libopenrac_launcher_lib.so; do
            unzip -l "$apk" "lib/arm64-v8a/$lib" > /dev/null || { echo "the APK has no $lib"; exit 1; }
          done
          if [ -f "$RUNNER_TEMP/updater.key" ]; then
            yarn tauri signer sign -f "$RUNNER_TEMP/updater.key" "$apk"
          fi
          rm -f "$RUNNER_TEMP/updater.key" "$RUNNER_TEMP/openrac.jks"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openrac-launcher-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # Any other build of a branch here or in a fork (not a pull request's): its launchers on the
  # branch's rolling pre-release `launcher-dev-<branch>`, made again each time, where the
  # launchers built from that branch look for their updates (Build the installers, above). Only
  # with the update key: a launcher installs no update without its signature.
  dev-release:
    if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: openrac-launcher-*
          path: installers
          merge-multiple: true
      - name: Rolling release of the branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! find installers -name '*.sig' | grep -q .; then
            echo "::notice::no update signatures (TAURI_SIGNING_PRIVATE_KEY is not set): nothing to publish"
            exit 0
          fi
          base=$(node -p "require('./launcher/src-tauri/tauri.conf.json').version")
          version="$base-dev.$GITHUB_RUN_NUMBER"
          channel="launcher-dev-$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"
          python3 tools/updater_manifest.py installers --tag "$channel" --repo "$GH_REPO" \
            --version "$version" --notes "Built from $GITHUB_REF_NAME at $GITHUB_SHA." --output installers/latest.json
          # The installers' names have spaces in them: an array, not a word list.
          mapfile -d '' files < <(find installers -type f -print0 | sort -z)
          printf '%s\n' "${files[@]}"
          gh release delete "$channel" --cleanup-tag --yes || true
          gh release create "$channel" --prerelease --target "$GITHUB_SHA" \
            --title "OpenRAC Launcher $version ($GITHUB_REF_NAME)" \
            --notes "The launchers built from $GITHUB_REF_NAME at $GITHUB_SHA; launchers built from this branch update from here." \
            "${files[@]}"

  # A tag `launcher-v*`: the installers of all the builds on a draft
  # release. Nothing is published until someone publishes the draft.
  release:
    if: startsWith(github.ref, 'refs/tags/launcher-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: openrac-launcher-*
          path: installers
          merge-multiple: true
      - name: Generate updater manifest
        env:
          TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 tools/updater_manifest.py installers --tag "$TAG" --repo "$GH_REPO" --output installers/latest.json
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # The installers' names have spaces in them: an array, not a word list.
          mapfile -d '' files < <(find installers -type f -print0 | sort -z)
          printf '%s\n' "${files[@]}"
          gh release create "$TAG" --draft --title "OpenRAC Launcher ${TAG#launcher-v}" \
            --notes "Installers built by the launcher workflow from $GITHUB_SHA." \
            "${files[@]}"
