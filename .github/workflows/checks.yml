# Checks that need neither a disc nor a toolchain: OpenRAC's own tests, the
# editor's, the generated tables, and each game's toolchain-free checks as
# its original repository ran them. Game builds need your own disc and
# proprietary compilers, so they run on contributors' machines.
#
# Every action is pinned to a commit (Dependabot, .github/dependabot.yml,
# moves the pins); the port's compiles are cached with ccache.
name: checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request stops the older run; master's runs all finish.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The workflows themselves: actionlint at a fixed version, checked against its SHA-256.
      - name: Workflows
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck=

      - name: OpenRAC tools
        run: python -m unittest discover -s tools -v

      - name: Level editor (synthetic data only)
        run: python -m unittest discover -s editor -v

      - name: Probe bake planning (synthetic data only)
        run: python -m unittest discover -s port/enhanced/tools/probes -v

      # The port's countable conventions (port/docs/CODING_CONVENTIONS.md): the rules for every
      # file, and the new-code rules on what this push or pull request adds. Lines it changes in
      # older files are reported, not failed (the page, section 24.4). clang-format is pinned.
      - name: Port conventions
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python -m pip install clang-format==21.1.8
          python -m unittest discover -s port/tools/conventions -v
          base=""
          if [ "$EVENT" = pull_request ]; then
            base="$PR_BASE"
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            base="$BEFORE"
          fi
          if [ -n "$base" ]; then
            git fetch --no-tags --depth=1 origin "$base"
            python port/tools/conventions/check_conventions.py --since "$base" --touched --clang-format clang-format
          else
            python port/tools/conventions/check_conventions.py
          fi

      - name: Generated tables match games/*/game.json and the reports
        run: |
          python tools/openrac.py tables
          git diff --exit-code -- README.md baserom/README.md games/README.md docs/SOURCES.md

      - name: Files the games share are still the same file
        run: python tools/shared.py check

      - name: rac1/pal progress report is current with its source
        working-directory: games/rac1
        run: python tools/gen_progress_report.py --check

      - name: rac4 progress report is current with its source
        working-directory: games/rac4/ntsc
        run: python tools/gen_progress_report.py --check

      - name: rac1/ntsc tools
        working-directory: games/rac1/ntsc
        run: |
          # scripts/data-refs.py and its tests read the executable with these
          # (the versions requirements.txt pins).
          python -m pip install capstone==5.0.7 pyelftools==0.33
          python scripts/test_public_tools.py -v
          python -m py_compile scripts/*.py

      - name: rac2 tools, layout and progress report
        working-directory: games/rac2/ntsc
        run: |
          python -m unittest discover -s tests -v
          python tests/check_repository.py
          python tools/progress.py --check

      - name: rac5 tools and layout
        working-directory: games/rac5/ntsc
        run: |
          python -m unittest discover -s tests -v
          python tools/check_repository.py

  # The desktop launcher (launcher/): its UI checks, and its Rust side, whose tests also check
  # launcher/actions.json against games/*/game.json. On Windows too, where paths join with
  # backslashes, files are checked out with CRLF and the Unix-only tests are left out.
  launcher:
    name: launcher (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: launcher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/launcher-toolchain
        with:
          cache-key: checks-launcher-${{ matrix.os }}
          components: clippy, rustfmt
      - name: Tauri's system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev

      - name: UI (svelte-check, ESLint, Prettier, Vitest)
        run: |
          yarn install --immutable
          yarn verify

      - name: Rust format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Rust tests (the logic, and actions.json against the checkout)
        run: cargo test -p openrac-launcher-core

      - name: Rust lints (the whole app)
        run: |
          yarn build
          cargo clippy --workspace --all-targets -- -D warnings

  # The native port (port/): hostgen's tests, then the whole port built with
  # Clang (SDL3 fetched by CMake) and its tests, the OpenGL ones on Mesa's
  # software renderer. The rac1 program is built from games/rac1's C.
  port:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: checks-port
          max-size: 1G
      - name: Compilers and SDL's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang ninja-build libgl1-mesa-dev libegl1-mesa-dev libgl1-mesa-dri \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev \
            mesa-vulkan-drivers vulkan-validationlayers

      - name: hostgen
        run: python -m unittest discover -s port/tools/hostgen -v

      - name: Build
        working-directory: port
        run: |
          cmake --preset release
          cmake --build --preset release

      - name: Tests
        working-directory: port
        env:
          SDL_VIDEO_DRIVER: offscreen
        run: ctest --preset release

  # Experimental Vulkan lighting and the offline Embree baker. Keep the normal
  # build above so compatibility and enhanced rendering are both exercised.
  port-enhanced:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: checks-port-enhanced
          max-size: 1G
      - name: Compilers, software Vulkan and Embree 4
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang ninja-build libembree-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgl1-mesa-dri mesa-vulkan-drivers vulkan-validationlayers \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev xvfb xauth
      - name: Build enhanced lighting and baker
        working-directory: port
        run: |
          cmake --preset enhanced -DOPENRAC_PORT_GAMES=OFF -DOPENRAC_PROBE_BAKER=ON
          cmake --build --preset enhanced
      - name: CPU, Vulkan and Embree tests
        working-directory: port
        env:
          SDL_VIDEO_DRIVER: x11
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a ctest --preset enhanced --output-junit "$PWD/build/enhanced/enhanced-tests.xml"
      - name: Enhanced GPU and bake checks must run, not skip
        working-directory: port
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          required = {'probe_gpu_vulkan', 'early_lighting_vulkan', 'hero_shadow_vulkan',
                      'sun_shadow_vulkan', 'gtao_vulkan', 'probe_bake', 'bake_liquids'}
          cases = {case.attrib['name']: case for case in ET.parse('build/enhanced/enhanced-tests.xml').iter('testcase')}
          missing = required - cases.keys()
          skipped = {name for name in required & cases.keys() if cases[name].find('skipped') is not None}
          assert not missing and not skipped, (missing, skipped)
          PY

  # The native port on Fedora (the release players run): the program built as the launcher's
  # "Build the game" builds it (tools/build_port.py), against the system's SDL3, Clang and CMake,
  # then hostgen's tests and every test of the port on Mesa's software renderer.
  port-fedora:
    runs-on: ubuntu-26.04
    container: registry.fedoraproject.org/fedora:44
    timeout-minutes: 60
    steps:
      - name: Compilers and SDL3
        run: |
          dnf install -y --setopt=install_weak_deps=False git clang cmake ninja-build python3 \
            SDL3-devel mesa-libGL-devel mesa-libEGL-devel mesa-dri-drivers \
            libX11-devel libXext-devel libXrandr-devel libXcursor-devel libXi-devel libXScrnSaver-devel \
            wayland-devel libxkbcommon-devel alsa-lib-devel pulseaudio-libs-devel mesa-vulkan-drivers
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build openrac-rac1-pal as the launcher builds it
        run: python3 tools/build_port.py rac1-pal

      - name: hostgen
        run: python3 -m unittest discover -s port/tools/hostgen

      # Every test program (the *_test targets), not the whole port: rac1/ntsc's program calls a
      # memchr nothing declares, which Clang 16 and later refuse.
      - name: Build the tests
        working-directory: port
        run: |
          targets=$(ninja -C build/release -t targets all | sed -n 's/^\([A-Za-z0-9_]*_test\): .*/\1/p' | sort -u)
          cmake --build --preset release --target $targets

      - name: Tests
        working-directory: port
        env:
          SDL_VIDEO_DRIVER: offscreen
        run: ctest --preset release

  # The native port on Windows: rac1/pal's program built as the launcher's
  # "Build the game" builds it (tools/build_port.py: Visual Studio's C++
  # libraries and the Windows SDK, Clang, Ninja), then the runtime's tests and
  # those of hostgen's that need no POSIX host. The port is written on Linux
  # and macOS, and what only builds there (execinfo.h, fseeko) stops here.
  port-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: checks-port-windows
          max-size: 1G
      - uses: ./.github/actions/clang-windows

      - name: Build openrac-rac1-pal and the runtime's tests
        run: python tools/build_port.py rac1-pal --target runtime_test

      - name: The runtime's tests
        run: port\build\release\runtime_test.exe

      - name: hostgen's tests
        run: python -m unittest discover -s port/tools/hostgen -v

