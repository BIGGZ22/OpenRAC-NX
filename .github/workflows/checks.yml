# Checks that need neither a disc nor a toolchain: OpenRAC's own tests, the
# editor's, the generated tables, and each game's toolchain-free checks as
# its original repository ran them. Game builds need your own disc and
# proprietary compilers, so they run on contributors' machines.
name: checks

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: OpenRAC tools
        run: python -m unittest discover -s tools -v

      - name: Level editor (synthetic data only)
        run: python -m unittest discover -s editor -v

      - name: Generated tables match games/*/game.json and the reports
        run: |
          python tools/openrac.py tables
          git diff --exit-code -- README.md baserom/README.md games/README.md docs/SOURCES.md

      - name: Files the games share are still the same file
        run: python tools/shared.py check

      - name: rac1/pal progress report is current with its source
        working-directory: games/rac1/pal
        run: python tools/gen_progress_report.py --check

      - name: rac4 progress report is current with its source
        working-directory: games/rac4/ntsc
        run: python tools/gen_progress_report.py --check

      - name: rac1/ntsc tools
        working-directory: games/rac1/ntsc
        run: |
          # scripts/data-refs.py and its tests read the executable with these
          # (the versions requirements.txt pins).
          python -m pip install capstone==5.0.7 pyelftools==0.33
          python scripts/test_public_tools.py -v
          python -m py_compile scripts/*.py

      - name: rac2 tools, layout and progress report
        working-directory: games/rac2/ntsc
        run: |
          python -m unittest discover -s tests -v
          python tests/check_repository.py
          python tools/progress.py --check

  # The desktop launcher (launcher/): its UI checks, and its Rust side, whose
  # tests also check launcher/actions.json against games/*/game.json.
  launcher:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Yarn (the version package.json names, through Corepack)
        run: corepack enable
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Tauri's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev

      - name: UI (svelte-check, ESLint, Prettier, Vitest)
        run: |
          yarn install --immutable
          yarn verify

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust tests (the logic, and actions.json against the checkout)
        run: cargo test -p openrac-launcher-core

      - name: Rust lints (the whole app)
        run: |
          yarn build
          cargo clippy --workspace --all-targets -- -D warnings

  # The native port (port/): hostgen's tests, then the whole port built with
  # Clang (SDL3 fetched by CMake) and its tests, the OpenGL ones on Mesa's
  # software renderer. The rac1 program is built from games/rac1/pal's C.
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compilers and SDL's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build libgl1-mesa-dev libegl1-mesa-dev libgl1-mesa-dri \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev

      - name: hostgen
        run: python -m unittest discover -s port/tools/hostgen -v

      - name: Build
        working-directory: port
        run: |
          cmake --preset release
          cmake --build --preset release

      - name: Tests
        working-directory: port
        env:
          SDL_VIDEO_DRIVER: offscreen
        run: ctest --preset release

