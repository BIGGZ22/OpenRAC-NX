# OpenRAC mods: build, test and release (the OpenRAC mod SDK's workflow, sdk/template). The same
# file serves a repository of one mod (its openrac-mod.json at the top) and one of several (a
# folder per mod, as OpenRAC/rac1-mods): it builds the top CMakeLists.txt, which makes every mod.
#
# Each push and pull request: every mod built and tested on Windows, Linux and macOS against the
# SDK sdk.lock pins (tools/fetch_sdk.py), each platform's build packaged as
# <id>-<version>-<platform>.zip, the platforms joined into <id>-<version>.zip, and SHA256SUMS over
# them all: the run's artifacts. A tag v<version> (or <id>-v<version>) also publishes them on that
# release, which is what OpenRAC's launcher installs from when a player pastes the repository's
# address (docs/port/MODS.md, section 10): push a tag, nothing else. The libraries are not signed.
#
# Every action is pinned to a commit.
name: build

on:
  push:
    branches: [master, main]
    tags: ["v*", "*-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Visual Studio's compiler, x64, with Ninja in its environment (Set up MSVC below).
          - name: windows-x86_64
            os: windows-2025
          # Ubuntu 22.04, the oldest the runners offer: a library built here needs glibc 2.35 or
          # later, what the launcher's Linux game needs too.
          - name: linux-x86_64
            os: ubuntu-22.04
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          # Apple silicon, and Intel cross-built on the same runner (one architecture per build).
          - name: macos-arm64
            os: macos-15
            configure: -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          - name: macos-x86_64
            os: macos-15
            configure: -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
            # An Intel build's tests cannot run on an Apple silicon runner without Rosetta.
            skip_tests: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Ninja
        run: python -m pip install ninja
      - name: Set up MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" | Out-File -Append $env:GITHUB_ENV }
          }
      - name: The SDK sdk.lock pins
        run: echo "SDK=$(python tools/fetch_sdk.py)" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release ${{ matrix.configure }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        if: ${{ !matrix.skip_tests }}
        run: ctest --test-dir build --output-on-failure --no-tests=ignore
      - name: Package
        run: |
          # Each mod's folder as openrac_add_mod laid it out, checked and zipped for this platform.
          python "$SDK/tools/package_mod.py" build/package/* -o dist
          ls -l dist
          for zip in dist/*.zip; do
            case "$zip" in
              *-"$NAME".zip) ;;
              *) echo "::error::$zip is not for $NAME"; exit 1 ;;
            esac
          done
        env:
          NAME: ${{ matrix.name }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mods-${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error

  # Each mod's archives of every platform joined into one, <id>-<version>.zip, and SHA256SUMS over
  # every archive, which the launcher checks each download against.
  merge:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: The SDK sdk.lock pins
        run: echo "SDK=$(python tools/fetch_sdk.py)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mods-*
          path: dist
          merge-multiple: true
      - name: Join the platforms, list the hashes
        run: |
          # <id>-<version>-<platform>.zip: the platform is the last two words, the rest the mod.
          for mod in $(ls dist/*.zip | sed -E 's#.*/(.*)-[a-z]+-[a-z0-9_]+\.zip#\1#' | sort -u); do
            python "$SDK/tools/package_mod.py" --merge dist/"$mod"-*.zip -o dist/"$mod".zip
          done
          (cd dist && sha256sum *.zip > SHA256SUMS)
          cat dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mods
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error

  # A tag: every archive and SHA256SUMS on the tag's release, published, for the launcher.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: merge
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mods
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          sdk=$(python3 -c 'import json; print(json.load(open("sdk.lock"))["version"])')
          printf 'Built by the build workflow from %s, against the OpenRAC mod SDK %s.\n\nInstall: paste this repository'"'"'s address in the OpenRAC launcher'"'"'s Mods tab, or add a .zip there.\n' \
            "$GITHUB_SHA" "$sdk" > notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" --clobber dist/*
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag dist/*
          fi
